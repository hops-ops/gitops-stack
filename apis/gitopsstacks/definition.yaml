apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: gitopsstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: GitopsStack
    plural: gitopsstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: GitopsStack installs ArgoCD, creates a GitHub repository, and wires them together for GitOps workflows.
        type: object
        properties:
          spec:
            description: GitopsStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for provider config names and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig for creating Object resources. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              githubProviderConfigRef:
                description: Reference to the GitHub ProviderConfig. Defaults to "default".
                type: object
                properties:
                  name:
                    description: Name of the GitHub ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              nodePool:
                description: Optional dedicated Karpenter NodePool for GitOps workloads. When enabled, ArgoCD pods are scheduled with workload-type=gitops and tolerate gitops=true:NoSchedule.
                type: object
                properties:
                  enabled:
                    description: Whether to create a dedicated NodePool. Defaults to false.
                    type: boolean
                    default: false
                  name:
                    description: NodePool name on the target cluster. Defaults to "hops-gitops".
                    type: string
                  nodeClassName:
                    description: EKS Auto Mode NodeClass to reference. Defaults to "hops-default".
                    type: string
                  limits:
                    description: Karpenter NodePool resource limits. Defaults to nodes=10.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  requirements:
                    description: Karpenter scheduling requirements. Defaults to amd64/linux spot or on-demand nodes.
                    type: array
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  disruption:
                    description: Karpenter disruption settings. Defaults to WhenEmptyOrUnderutilized after 60s.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              namespace:
                description: Namespace for ArgoCD. Defaults to argocd.
                type: string
              argocd:
                description: Configuration for the ArgoCD Helm release.
                type: object
                properties:
                  name:
                    description: Helm release name. Defaults to argocd.
                    type: string
                  namespace:
                    description: Namespace override for ArgoCD.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              exposure:
                description: Optional public exposure of the ArgoCD server through an existing Gateway API Gateway.
                type: object
                properties:
                  enabled:
                    description: Enable an HTTPRoute for the ArgoCD server. Defaults to false.
                    type: boolean
                    default: false
                  hostname:
                    description: Public DNS hostname for ArgoCD.
                    type: string
                    minLength: 1
                  gatewayRef:
                    description: Existing Gateway listener that accepts the ArgoCD HTTPRoute.
                    type: object
                    properties:
                      name:
                        description: Gateway name. Defaults to platform.
                        type: string
                      namespace:
                        description: Gateway namespace. Defaults to istio-ingress.
                        type: string
                      sectionName:
                        description: Gateway listener section name. Defaults to https.
                        type: string
                x-kubernetes-validations:
                - rule: "!self.enabled || has(self.hostname)"
                  message: spec.exposure.hostname is required when exposure is enabled
              auth:
                description: Authentication configuration for ArgoCD.
                type: object
                properties:
                  oidc:
                    description: Native ArgoCD OIDC backed by a Zitadel application managed in the target cluster.
                    type: object
                    properties:
                      enabled:
                        description: Enable native ArgoCD OIDC with Zitadel. Defaults to false.
                        type: boolean
                        default: false
                      name:
                        description: Identity provider display name. Defaults to Zitadel.
                        type: string
                      issuerURL:
                        description: Public Zitadel OIDC issuer URL.
                        type: string
                        pattern: '^https://[^/?#[:space:]]+(?:/[^?#[:space:]]*)?$'
                      requestedScopes:
                        description: OIDC scopes requested by ArgoCD. Defaults to openid, profile, and email.
                        type: array
                        minItems: 1
                        items:
                          type: string
                      rbac:
                        description: Minimal ArgoCD RBAC mappings for OIDC identities.
                        type: object
                        properties:
                          adminEmails:
                            description: Email addresses explicitly mapped to ArgoCD's built-in admin role.
                            type: array
                            items:
                              type: string
                              format: email
                      zitadel:
                        description: Zitadel management inputs used to create the Project and OIDC application.
                        type: object
                        properties:
                          awsSecretsManagerPath:
                            description: AWS Secrets Manager path containing the AuthStack access token.
                            type: string
                            minLength: 1
                          accessTokenProperty:
                            description: JSON property containing the access token. Defaults to access_token.
                            type: string
                          secretStoreName:
                            description: ClusterSecretStore used to read the access token. Defaults to default.
                            type: string
                          projectName:
                            description: Zitadel Project name. Defaults to {clusterName}-argocd.
                            type: string
                          applicationName:
                            description: Zitadel OIDC application name. Defaults to {clusterName}-argocd.
                            type: string
                        required:
                        - awsSecretsManagerPath
                    x-kubernetes-validations:
                    - rule: "!self.enabled || (has(self.issuerURL) && has(self.zitadel))"
                      message: spec.auth.oidc.issuerURL and spec.auth.oidc.zitadel are required when OIDC is enabled
              repository:
                description: Configuration for the GitOps GitHub repository.
                type: object
                properties:
                  org:
                    description: GitHub organization that owns the repository.
                    type: string
                  name:
                    description: Repository name. Defaults to {clusterName}-gitops.
                    type: string
                  externalName:
                    description: Existing GitHub repository name to import instead of creating a new repository.
                    type: string
                  description:
                    description: Repository description.
                    type: string
                  visibility:
                    description: Repository visibility. Defaults to private.
                    type: string
                    enum:
                    - public
                    - private
                    - internal
                  template:
                    description: Template repository to use for initialization.
                    type: object
                    properties:
                      owner:
                        description: Owner of the template repository.
                        type: string
                      repository:
                        description: Name of the template repository.
                        type: string
                  autoInit:
                    description: Create an initial commit with an empty README. Defaults to true. Ignored when template is set.
                    type: boolean
                  topics:
                    description: Topics for the repository.
                    type: array
                    items:
                      type: string
                  deleteBranchOnMerge:
                    description: Automatically delete head branches on merge. Defaults to true.
                    type: boolean
                  allowDelete:
                    description: Allow Crossplane to delete the repository when the XR is deleted. Defaults to false for safety.
                    type: boolean
                    default: false
                  webhook:
                    description: GitHub webhook that immediately refreshes ArgoCD Applications when the repository changes. Requires SecretStack and public ArgoCD exposure.
                    type: object
                    properties:
                      enabled:
                        description: Create a push webhook targeting the exposed ArgoCD server. Defaults to false.
                        type: boolean
                        default: false
                      generate:
                        description: Generate the shared secret and push it to AWS Secrets Manager. Defaults to true. Set false to use a pre-existing secret.
                        type: boolean
                        default: true
                      secretStoreName:
                        description: ClusterSecretStore used to push and read the webhook secret. Defaults to externalSecrets.secretStoreName, then default.
                        type: string
                      secretPath:
                        description: AWS Secrets Manager path containing the webhook secret.
                        type: string
                        minLength: 1
                      secretKey:
                        description: JSON property containing the webhook secret. Defaults to webhookSecret.
                        type: string
                        default: webhookSecret
                      maxPayloadSizeMB:
                        description: Maximum webhook request payload accepted by ArgoCD. Defaults to 10 MiB.
                        type: integer
                        minimum: 1
                        maximum: 50
                        default: 10
                    x-kubernetes-validations:
                    - rule: "!self.enabled || has(self.secretPath)"
                      message: spec.repository.webhook.secretPath is required when the webhook is enabled
                    - rule: "!self.enabled || !self.generate || !has(self.secretPath) || self.secretPath.startsWith('push/')"
                      message: spec.repository.webhook.secretPath must start with push/ when secret generation is enabled
                required:
                - org
              externalSecrets:
                description: External Secrets Operator integration for ArgoCD repository credentials. Requires SecretStack as a prerequisite.
                type: object
                properties:
                  enabled:
                    description: Enable ESO integration. Creates an ExternalSecret to pull GitHub App or token credentials from AWS Secrets Manager into ArgoCD repo-creds.
                    type: boolean
                  secretStoreName:
                    description: Name of the ClusterSecretStore created by SecretStack. Defaults to "default".
                    type: string
                  githubApp:
                    description: GitHub App credential references in AWS Secrets Manager.
                    type: object
                    properties:
                      secretPath:
                        description: AWS Secrets Manager secret name containing GitHub App credentials.
                        type: string
                      appIdKey:
                        description: JSON key for the GitHub App ID within the secret. Defaults to "appId".
                        type: string
                      installationIdKey:
                        description: JSON key for the GitHub App Installation ID within the secret. Optional — ArgoCD auto-discovers from the org when omitted.
                        type: string
                      privateKeyKey:
                        description: JSON key for the GitHub App private key within the secret. Defaults to "privateKey".
                        type: string
                    required:
                    - secretPath
                  githubToken:
                    description: GitHub token credential reference in AWS Secrets Manager. Used instead of githubApp when configured.
                    type: object
                    properties:
                      secretPath:
                        description: AWS Secrets Manager secret name containing the GitHub token.
                        type: string
                      tokenKey:
                        description: JSON key for the GitHub token within the secret. Defaults to "token".
                        type: string
                      username:
                        description: HTTPS username written to the ArgoCD repo-creds Secret. Defaults to "x-access-token".
                        type: string
                    required:
                    - secretPath
              applications:
                description: ArgoCD Application configuration.
                type: object
                properties:
                  apps:
                    description: Root app-of-apps Application that syncs ArgoCD Application manifests from the gitops repo.
                    type: object
                    properties:
                      enabled:
                        description: Enable the apps Application. Defaults to true.
                        type: boolean
                      path:
                        description: Path in the gitops repo to sync. Defaults to apps.
                        type: string
                  crossplane:
                    description: Crossplane-specific ArgoCD projects and applications.
                    type: object
                    properties:
                      enabled:
                        description: Enable Crossplane integration apps.
                        type: boolean
            required:
            - clusterName
            x-kubernetes-validations:
            - rule: "!has(self.auth) || !has(self.auth.oidc) || !self.auth.oidc.enabled || (has(self.exposure) && self.exposure.enabled)"
              message: spec.exposure.enabled must be true when native OIDC is enabled
            - rule: "!has(self.repository) || !has(self.repository.webhook) || !self.repository.webhook.enabled || (has(self.exposure) && self.exposure.enabled)"
              message: spec.exposure.enabled must be true when the GitHub webhook is enabled
          status:
            description: GitopsStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness of the GitOps stack.
                type: boolean
              repository:
                description: GitOps repository information.
                type: object
                properties:
                  url:
                    description: Full URL of the gitops repository.
                    type: string
              oidc:
                description: Observed ArgoCD OIDC client state.
                type: object
                properties:
                  clientId:
                    description: Zitadel client ID observed from the managed OIDC application.
                    type: string
        required:
        - spec
